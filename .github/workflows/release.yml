name: Generate Semantic Release

on:
  push:
    branches:
      - version-15

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup dependencies
        run: |
          npm install @semantic-release/git @semantic-release/exec @semantic-release/changelog --no-save

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "KTA PR Bot"
          GIT_AUTHOR_EMAIL: "bilgi@kta-endustri.com.tr"
          GIT_COMMITTER_NAME: "KTA PR Bot"
          GIT_COMMITTER_EMAIL: "bilgi@kta-endustri.com.tr"
        run: npx semantic-release
